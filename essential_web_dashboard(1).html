    <style>
        /* Smooth Wallpaper Crossfade */
        .wallpaper-layer {
            position: fixed;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: opacity 1.5s ease-in-out;
            z-index: -2;
        }

        /* Glassmorphism utility classes */
        .glass-panel {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        
        .dark .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .dark .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-card:hover, .glass-card.keyboard-focused {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 14px 30px -10px rgba(14, 165, 233, 0.35);
        }

        .dark .glass-card:hover, .dark .glass-card.keyboard-focused {
            box-shadow: 0 14px 30px -10px rgba(14, 165, 233, 0.5);
        }

        .glass-card.keyboard-focused {
            outline: 2px solid #0ea5e9;
            outline-offset: 2px;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.4);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(156, 163, 175, 0.7);
        }
    </style>
</head>

    <div class="flex-1 flex flex-col max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">

        <!-- Header / Controls Bar -->
        <header class="glass-panel rounded-2xl p-4 sm:p-5 mb-8 flex flex-col md:flex-row items-center justify-between gap-4 shadow-lg">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center text-white shadow-md">

                </div>
                <div>
                    <h1 class="font-bold text-xl sm:text-2xl tracking-tight bg-gradient-to-r from-sky-600 to-indigo-600 dark:from-sky-400 dark:to-indigo-300 bg-clip-text text-transparent">
                        Essential Web Hub
                    </h1>
                    <p class="text-xs text-slate-600 dark:text-slate-400 font-medium">Your curated gateway to top tools & services</p>
                </div>
            </div>

            <!-- Dashboard Controls (Theme & Wallpaper) -->
            <div class="flex flex-wrap items-center gap-3 text-xs">
                <!-- Wallpaper Controls -->
                <div class="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10">
                    <button id="prevWallpaperBtn" title="Previous Wallpaper" class="hover:text-sky-500 transition-colors px-1">
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <button id="toggleRotateBtn" title="Toggle Auto Rotation" class="flex items-center gap-1.5 font-medium px-1 hover:text-sky-500 transition-colors">
                        <i id="rotateIcon" class="fa-solid fa-sync fa-spin text-sky-500"></i>
                        <span id="rotateStatusText">Auto</span>
                    </button>
                    <button id="nextWallpaperBtn" title="Next Wallpaper" class="hover:text-sky-500 transition-colors px-1">
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>

                <!-- Theme Sync Mode Status -->
                <div class="flex items-center gap-2 px-3 py-1.5 rounded-lg bg-black/5 dark:bg-white/5 border border-black/10 dark:border-white/10">
                    <span id="themeIndicatorIcon" class="text-amber-500 dark:text-sky-400">
                        <i class="fa-solid fa-circle-half-stroke"></i>
                    </span>
                    <span id="themeStatusText" class="font-medium text-slate-700 dark:text-slate-300">System Theme Sync</span>
                    <button id="toggleThemeModeBtn" title="Cycle Theme (Auto Sync / Dark / Light)" class="ml-1 text-slate-500 hover:text-slate-900 dark:hover:text-white transition-colors">
                        <i class="fa-solid fa-sliders"></i>
                    </button>
                </div>
            </div>
        </header>

        <section class="mb-8 flex flex-col items-center">
            <div class="w-full max-w-2xl relative mb-4">
                <div class="relative flex items-center">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 text-slate-400 text-lg pointer-events-none"></i>
                    <input 
                        type="text" 
                        id="searchInput" 
                        placeholder="Search apps, wiki, proton, google (Ctrl + S)..." 
                        autocomplete="off"
                        class="w-full pl-12 pr-32 py-4 rounded-2xl glass-panel text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 text-base shadow-xl focus:outline-none focus:ring-2 focus:ring-sky-500/70 border-white/40 dark:border-white/10 transition-all"
                    >
                    <div class="absolute right-3 flex items-center gap-1.5 pointer-events-none">
                        <kbd class="hidden sm:inline-block px-2 py-1 text-xs font-semibold text-slate-500 dark:text-slate-400 bg-slate-200/60 dark:bg-slate-800/80 rounded border border-slate-300/60 dark:border-slate-700 shadow-sm">Ctrl + S</kbd>
                        <kbd id="escBadge" class="hidden sm:inline-block px-2 py-1 text-xs font-semibold text-slate-500 dark:text-slate-400 bg-slate-200/60 dark:bg-slate-800/80 rounded border border-slate-300/60 dark:border-slate-700 shadow-sm">Esc</kbd>
                    </div>
                </div>
            </div>

            <!-- Category Filters -->
            <div id="categoryChips" class="flex flex-wrap justify-center gap-2">
                <button data-category="all" class="category-chip px-3.5 py-1.5 rounded-xl text-xs font-semibold tracking-wide transition-all shadow-sm bg-sky-500 text-white">All</button>
                <button data-category="ai" class="category-chip px-3.5 py-1.5 rounded-xl text-xs font-semibold tracking-wide transition-all glass-panel text-slate-700 dark:text-slate-300 hover:bg-sky-500/20">AI Work</button>
                <button data-category="proton" class="category-chip px-3.5 py-1.5 rounded-xl text-xs font-semibold tracking-wide transition-all glass-panel text-slate-700 dark:text-slate-300 hover:bg-sky-500/20">Proton Suite</button>
                <button data-category="google" class="category-chip px-3.5 py-1.5 rounded-xl text-xs font-semibold tracking-wide transition-all glass-panel text-slate-700 dark:text-slate-300 hover:bg-sky-500/20">Google Suite</button>
                <button data-category="microsoft" class="category-chip px-3.5 py-1.5 rounded-xl text-xs font-semibold tracking-wide transition-all glass-panel text-slate-700 dark:text-slate-300 hover:bg-sky-500/20">Microsoft Suite</button>
                <button data-category="wiki" class="category-chip px-3.5 py-1.5 rounded-xl text-xs font-semibold tracking-wide transition-all glass-panel text-slate-700 dark:text-slate-300 hover:bg-sky-500/20">Wiki Resources</button>
                <button data-category="email" class="category-chip px-3.5 py-1.5 rounded-xl text-xs font-semibold tracking-wide transition-all glass-panel text-slate-700 dark:text-slate-300 hover:bg-sky-500/20">Email & Privacy</button>
                <button data-category="social" class="category-chip px-3.5 py-1.5 rounded-xl text-xs font-semibold tracking-wide transition-all glass-panel text-slate-700 dark:text-slate-300 hover:bg-sky-500/20">Social & Media</button>
                <button data-category="work" class="category-chip px-3.5 py-1.5 rounded-xl text-xs font-semibold tracking-wide transition-all glass-panel text-slate-700 dark:text-slate-300 hover:bg-sky-500/20">Work & Productivity</button>
                <button data-category="utilities" class="category-chip px-3.5 py-1.5 rounded-xl text-xs font-semibold tracking-wide transition-all glass-panel text-slate-700 dark:text-slate-300 hover:bg-sky-500/20">Utilities</button>
            </div>
        </section>

        <!-- Main Apps Grid -->
        <main class="flex-1">
            <div id="appsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                <!-- App Cards will be populated dynamically -->
            </div>

            <!-- Empty Search State -->
            <div id="noResults" class="hidden flex flex-col items-center justify-center py-16 text-center">
                <div class="w-16 h-16 rounded-full glass-panel flex items-center justify-center text-slate-400 mb-4 text-2xl">
                    <i class="fa-solid fa-ghost"></i>
                </div>
                <h3 class="text-lg font-bold text-slate-700 dark:text-slate-200 mb-1">No apps found</h3>
                <p class="text-sm text-slate-500 dark:text-slate-400 max-w-sm mb-4">We couldn't find anything matching your search term.</p>
                <button id="clearSearchBtn" class="px-4 py-2 rounded-xl bg-sky-500 hover:bg-sky-600 text-white text-xs font-semibold transition-colors">Clear Search (Esc)</button>
            </div>
        </main>

        <!-- Shortcut & Keyboard Instruction Footer -->
        <footer class="mt-12 glass-panel rounded-2xl p-4 text-xs text-slate-600 dark:text-slate-400 flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center gap-2 flex-wrap">
                <i class="fa-solid fa-keyboard text-sky-500 text-sm"></i>
                <span><strong class="text-slate-800 dark:text-slate-200">Mouse-Free Controls:</strong> 
                    <kbd class="px-1.5 py-0.5 rounded bg-black/10 dark:bg-white/10 font-mono">Ctrl + S</kbd> Search &nbsp;|&nbsp; 
                    <kbd class="px-1.5 py-0.5 rounded bg-black/10 dark:bg-white/10 font-mono">↑ ↓ ← →</kbd> Navigate &nbsp;|&nbsp; 
                    <kbd class="px-1.5 py-0.5 rounded bg-black/10 dark:bg-white/10 font-mono">Enter</kbd> Open Selected &nbsp;|&nbsp; 
                    <kbd class="px-1.5 py-0.5 rounded bg-black/10 dark:bg-white/10 font-mono">Esc</kbd> Clear
                </span>
            </div>
            <div class="flex items-center gap-2">
                <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span>Links open in a new tab</span>
            </div>
        </footer>

    </div>

    <!-- Application JavaScript -->
    <script>
        // Safe Settings Storage Helpers (Safely handles sandbox environments)
        function saveSetting(key, val) {
            try {
                localStorage.setItem('web_hub_' + key, JSON.stringify(val));
            } catch (e) {
                // Safe silent catch if localStorage is restricted by iframe policy
            }
        }

        function getSetting(key, defaultVal) {
            try {
                const item = localStorage.getItem('web_hub_' + key);
                return item !== null ? JSON.parse(item) : defaultVal;
            } catch (e) {
                return defaultVal;
            }
        }

        // Load apps data from JSON script tag
        const rawJsonText = document.getElementById('appsJsonData').textContent;
        const appsDatabase = JSON.parse(rawJsonText);

        // Wallpapers Collection (High Quality Unsplash Curated)
        const wallpapers = [
            "https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1920&q=80",
            "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80",
            "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=1920&q=80",
            "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=1920&q=80",
            "https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=1920&q=80",
            "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=1920&q=80"
        ];

        // App State restored from saved settings
        let currentWallpaperIdx = getSetting('wallpaper_idx', 0);
        let isAutoRotate = getSetting('wallpaper_rotate', true);
        let wallpaperInterval = null;
        let activeCategory = getSetting('active_category', 'all');
        let themeMode = getSetting('theme_mode', 'auto'); // 'auto', 'dark', 'light'
        let currentBgLayer = 1;
        let selectedAppIndex = 0; // For mouse-free keyboard navigation

        // DOM Elements
        const appsGrid = document.getElementById('appsGrid');
        const searchInput = document.getElementById('searchInput');
        const noResults = document.getElementById('noResults');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const bgLayer1 = document.getElementById('bgLayer1');
        const bgLayer2 = document.getElementById('bgLayer2');
        const prevWallpaperBtn = document.getElementById('prevWallpaperBtn');
        const nextWallpaperBtn = document.getElementById('nextWallpaperBtn');
        const toggleRotateBtn = document.getElementById('toggleRotateBtn');
        const rotateIcon = document.getElementById('rotateIcon');
        const rotateStatusText = document.getElementById('rotateStatusText');
        const toggleThemeModeBtn = document.getElementById('toggleThemeModeBtn');
        const themeStatusText = document.getElementById('themeStatusText');
        const themeIndicatorIcon = document.getElementById('themeIndicatorIcon');

        // Initial setup
        window.addEventListener('DOMContentLoaded', () => {
            syncCategoryChipsUI();
            renderApps();
            initWallpaper();
            setupThemeSync();
            setupEventListeners();
        });

        function syncCategoryChipsUI() {
            document.querySelectorAll('.category-chip').forEach(chip => {
                if (chip.dataset.category === activeCategory) {
                    chip.classList.remove('glass-panel', 'text-slate-700', 'dark:text-slate-300');
                    chip.classList.add('bg-sky-500', 'text-white');
                } else {
                    chip.classList.remove('bg-sky-500', 'text-white');
                    chip.classList.add('glass-panel', 'text-slate-700', 'dark:text-slate-300');
                }
            });
        }

        // Render Apps Grid & Apply Keyboard Focus Selection
        function renderApps() {
            const query = searchInput.value.trim().toLowerCase();
            appsGrid.innerHTML = '';

            const filtered = appsDatabase.filter(app => {
                const matchesCategory = activeCategory === 'all' || app.category === activeCategory;
                const matchesSearch = app.name.toLowerCase().includes(query) || 
                                      app.categoryLabel.toLowerCase().includes(query) ||
                                      app.desc.toLowerCase().includes(query) ||
                                      app.id.toLowerCase().includes(query);
                return matchesCategory && matchesSearch;
            });

            if (filtered.length === 0) {
                noResults.classList.remove('hidden');
                selectedAppIndex = -1;
            } else {
                noResults.classList.add('hidden');
                
                // Keep selection within bounds
                if (selectedAppIndex >= filtered.length) {
                    selectedAppIndex = filtered.length - 1;
                }
                if (selectedAppIndex < 0) {
                    selectedAppIndex = 0;
                }

                filtered.forEach((app, index) => {
                    const card = document.createElement('a');
                    card.href = app.url;
                    card.target = "_blank";
                    card.rel = "noopener noreferrer";
                    card.dataset.index = index;
                    
                    const isFocused = index === selectedAppIndex;
                    const focusClasses = isFocused ? 'keyboard-focused' : '';

                    card.className = `app-card glass-card rounded-2xl p-5 flex flex-col justify-between group text-left ${focusClasses}`;
                    
                    card.innerHTML = `
                        <div>
                            <div class="flex items-center justify-between mb-3">
                                <div class="w-12 h-12 rounded-xl bg-gradient-to-tr ${app.color} flex items-center justify-center text-white shadow-md group-hover:scale-110 transition-transform">
                                    <i class="${app.iconClass} text-xl"></i>
                                </div>
                                <span class="px-2.5 py-1 rounded-full text-[10px] font-bold tracking-wider uppercase bg-black/5 dark:bg-white/10 text-slate-600 dark:text-slate-300">
                                    ${app.categoryLabel}
                                </span>
                            </div>
                            <h3 class="font-bold text-lg text-slate-800 dark:text-white group-hover:text-sky-500 dark:group-hover:text-sky-400 transition-colors flex items-center gap-1.5">
                                ${app.name}
                                <i class="fa-solid fa-arrow-up-right-from-square text-xs opacity-0 group-hover:opacity-100 transition-opacity text-sky-500"></i>
                            </h3>
                            <p class="text-xs text-slate-600 dark:text-slate-400 mt-1 line-clamp-2 font-normal leading-relaxed">
                                ${app.desc}
                            </p>
                        </div>
                        <div class="mt-4 pt-3 border-t border-black/5 dark:border-white/5 flex items-center justify-between text-[11px] text-slate-500 dark:text-slate-400">
                            <span class="flex items-center gap-1">
                                ${isFocused ? '<span class="px-1.5 py-0.5 rounded bg-sky-500 text-white font-mono text-[9px]">ENTER TO OPEN</span>' : 'Open service'}
                            </span>
                            <span class="font-semibold group-hover:translate-x-1 transition-transform inline-flex items-center gap-1">
                                Launch <i class="fa-solid fa-chevron-right text-[9px]"></i>
                            </span>
                        </div>
                    `;

                    // Mouse hover synchronizes keyboard highlight index
                    card.addEventListener('mouseenter', () => {
                        updateCardSelection(index);
                    });

                    appsGrid.appendChild(card);
                });

                // Scroll focused card into view smoothly if navigating via keyboard
                const activeCard = appsGrid.querySelector('.keyboard-focused');
                if (activeCard && document.activeElement === searchInput) {
                    activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
        }

        function updateCardSelection(newIndex) {
            const cards = appsGrid.querySelectorAll('.app-card');
            if (cards.length === 0) return;
            
            selectedAppIndex = Math.max(0, Math.min(newIndex, cards.length - 1));
            
            cards.forEach((card, i) => {
                if (i === selectedAppIndex) {
                    card.classList.add('keyboard-focused');
                    const badgeContainer = card.querySelector('.mt-4.pt-3 span');
                    if (badgeContainer) badgeContainer.innerHTML = '<span class="px-1.5 py-0.5 rounded bg-sky-500 text-white font-mono text-[9px]">ENTER TO OPEN</span>';
                } else {
                    card.classList.remove('keyboard-focused');
                    const badgeContainer = card.querySelector('.mt-4.pt-3 span');
                    if (badgeContainer) badgeContainer.innerHTML = 'Open service';
                }
            });
        }

        // Rotating Wallpaper Manager
        function initWallpaper() {
            if (currentWallpaperIdx < 0 || currentWallpaperIdx >= wallpapers.length) {
                currentWallpaperIdx = 0;
            }
            bgLayer1.style.backgroundImage = `url('${wallpapers[currentWallpaperIdx]}')`;
            
            if (isAutoRotate) {
                rotateIcon.classList.add('fa-spin');
                rotateStatusText.textContent = "Auto";
                startWallpaperRotation();
            } else {
                rotateIcon.classList.remove('fa-spin');
                rotateStatusText.textContent = "Paused";
                stopWallpaperRotation();
            }
        }

        function changeWallpaper(nextIdx) {
            if (nextIdx !== undefined) {
                currentWallpaperIdx = nextIdx;
            } else {
                currentWallpaperIdx = (currentWallpaperIdx + 1) % wallpapers.length;
            }

            saveSetting('wallpaper_idx', currentWallpaperIdx);
            const nextImg = wallpapers[currentWallpaperIdx];

            if (currentBgLayer === 1) {
                bgLayer2.style.backgroundImage = `url('${nextImg}')`;
                bgLayer2.classList.remove('opacity-0');
                bgLayer2.classList.add('opacity-100');
                bgLayer1.classList.remove('opacity-100');
                bgLayer1.classList.add('opacity-0');
                currentBgLayer = 2;
            } else {
                bgLayer1.style.backgroundImage = `url('${nextImg}')`;
                bgLayer1.classList.remove('opacity-0');
                bgLayer1.classList.add('opacity-100');
                bgLayer2.classList.remove('opacity-100');
                bgLayer2.classList.add('opacity-0');
                currentBgLayer = 1;
            }
        }

        function startWallpaperRotation() {
            stopWallpaperRotation();
            if (isAutoRotate) {
                wallpaperInterval = setInterval(() => {
                    changeWallpaper();
                }, 12000);
            }
        }

        function stopWallpaperRotation() {
            if (wallpaperInterval) {
                clearInterval(wallpaperInterval);
                wallpaperInterval = null;
            }
        }

        // Auto System Theme Synchronization Logic
        function setupThemeSync() {
            const mediaQuery = window.matchMedia('(prefers-color-scheme: dark)');

            function applyTheme(isDark) {
                if (isDark) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }

            function syncWithSystem() {
                if (themeMode === 'auto') {
                    applyTheme(mediaQuery.matches);
                    themeStatusText.textContent = "System Theme Sync";
                    themeIndicatorIcon.innerHTML = `<i class="fa-solid fa-circle-half-stroke"></i>`;
                } else if (themeMode === 'dark') {
                    applyTheme(true);
                    themeStatusText.textContent = "Dark Theme";
                    themeIndicatorIcon.innerHTML = `<i class="fa-solid fa-moon"></i>`;
                } else {
                    applyTheme(false);
                    themeStatusText.textContent = "Light Theme";
                    themeIndicatorIcon.innerHTML = `<i class="fa-solid fa-sun"></i>`;
                }
                saveSetting('theme_mode', themeMode);
            }

            // Listen for system preference updates
            mediaQuery.addEventListener('change', (e) => {
                if (themeMode === 'auto') {
                    applyTheme(e.matches);
                }
            });

            syncWithSystem();

            // Cycle Theme Modes
            toggleThemeModeBtn.addEventListener('click', () => {
                if (themeMode === 'auto') themeMode = 'dark';
                else if (themeMode === 'dark') themeMode = 'light';
                else themeMode = 'auto';
                syncWithSystem();
            });
        }

        // Event Listeners & Mouse-Free Keyboard Shortcuts
        function setupEventListeners() {
            // Search Input Typing Listener -> Always selects 1st matching item automatically
            searchInput.addEventListener('input', () => {
                selectedAppIndex = 0;
                renderApps();
            });

            // Category Filter Chips
            document.querySelectorAll('.category-chip').forEach(chip => {
                chip.addEventListener('click', (e) => {
                    activeCategory = e.target.dataset.category;
                    saveSetting('active_category', activeCategory);
                    syncCategoryChipsUI();
                    selectedAppIndex = 0;
                    renderApps();
                });
            });

            // Clear search button
            clearSearchBtn.addEventListener('click', resetSearch);

            // Global Mouse-Free Keyboard Shortcuts & Arrow Key Navigation
            document.addEventListener('keydown', (e) => {
                const cards = appsGrid.querySelectorAll('.app-card');

                // Ctrl + S (or Cmd + S) -> Focus Search Input
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
                    e.preventDefault();
                    searchInput.focus();
                    searchInput.select();
                    selectedAppIndex = 0;
                    updateCardSelection(0);
                    return;
                }

                // Esc -> Clear Search Input & Selection
                if (e.key === 'Escape') {
                    resetSearch();
                    return;
                }

                // Arrow Navigation (Down / Right -> Next, Up / Left -> Previous)
                if (cards.length > 0) {
                    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                        e.preventDefault();
                        updateCardSelection(selectedAppIndex + 1);
                        cards[selectedAppIndex]?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                        e.preventDefault();
                        updateCardSelection(selectedAppIndex - 1);
                        cards[selectedAppIndex]?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                }

                // Enter Key -> Open currently highlighted app card in a new tab!
                if (e.key === 'Enter') {
                    const focusedCard = cards[selectedAppIndex] || appsGrid.querySelector('.app-card');
                    if (focusedCard) {
                        e.preventDefault();
                        window.open(focusedCard.href, '_blank', 'noopener,noreferrer');
                    }
                }
            });

            // Wallpaper Manual Controls
            prevWallpaperBtn.addEventListener('click', () => {
                const prevIdx = (currentWallpaperIdx - 1 + wallpapers.length) % wallpapers.length;
                changeWallpaper(prevIdx);
                if (isAutoRotate) startWallpaperRotation();
            });

            nextWallpaperBtn.addEventListener('click', () => {
                changeWallpaper();
                if (isAutoRotate) startWallpaperRotation();
            });

            toggleRotateBtn.addEventListener('click', () => {
                isAutoRotate = !isAutoRotate;
                saveSetting('wallpaper_rotate', isAutoRotate);
                if (isAutoRotate) {
                    rotateIcon.classList.add('fa-spin');
                    rotateStatusText.textContent = "Auto";
                    startWallpaperRotation();
                } else {
                    rotateIcon.classList.remove('fa-spin');
                    rotateStatusText.textContent = "Paused";
                    stopWallpaperRotation();
                }
            });
        }

        // Helper to clear search & reset keyboard selection
        function resetSearch() {
            searchInput.value = '';
            searchInput.blur();
            selectedAppIndex = 0;
            renderApps();
        }
    </script>
</body>
</html>
